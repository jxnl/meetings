<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting YAML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .yaml-container {
            background-color: #f8f9fa;
            border-radius: 5px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            max-height: 80vh;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.5;
        }
        .copy-success {
            color: #198754;
            font-weight: bold;
        }
        .yaml-header {
            position: sticky;
            top: 0;
            background-color: #fff;
            z-index: 1000;
            padding: 1rem 0;
            border-bottom: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="yaml-header mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <h1>Generated Meeting YAML</h1>
                <div>
                    <button id="copyBtn" class="btn btn-outline-primary me-2">Copy to Clipboard</button>
                    <a href="/meetings/" class="btn btn-secondary">Back to Meetings</a>
                </div>
            </div>
            <div class="mt-3">
                <div class="alert alert-info">
                    <p class="mb-0"><strong>YAML Generated:</strong> {{ meetings_count }} meeting(s) selected with attendee information included.</p>
                </div>
            </div>
        </div>
        
        <div id="yamlContent" class="yaml-container">{{ yaml_content }}</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const copyBtn = document.getElementById('copyBtn');
            const yamlContent = document.getElementById('yamlContent');
            
            copyBtn.addEventListener('click', function() {
                navigator.clipboard.writeText(yamlContent.textContent)
                    .then(() => {
                        const originalText = copyBtn.textContent;
                        copyBtn.textContent = 'Copied!';
                        copyBtn.classList.add('copy-success');
                        setTimeout(() => {
                            copyBtn.textContent = originalText;
                            copyBtn.classList.remove('copy-success');
                        }, 2000);
                    })
                    .catch(err => {
                        console.error('Failed to copy: ', err);
                        alert('Failed to copy to clipboard');
                    });
            });
        });
    </script>
</body>
</html>
